<script>
        // Simple enter animations
        window.addEventListener('DOMContentLoaded', () => {
            const title = document.getElementById('hero-title');
            const sub = document.getElementById('hero-sub');
            const cta = document.getElementById('hero-cta');
            
            setTimeout(() => {
                title.classList.remove('opacity-0', 'translate-y-12');
                title.classList.add('opacity-100', 'translate-y-0');
            }, 300);
            
            setTimeout(() => {
                sub.classList.remove('opacity-0', 'translate-y-8');
                sub.classList.add('opacity-100', 'translate-y-0');
            }, 600);
            
            setTimeout(() => {
                cta.classList.remove('opacity-0', 'translate-y-8');
                cta.classList.add('opacity-100', 'translate-y-0');
            }, 900);

            // Parallax effect on scroll
            window.addEventListener('scroll', () => {
                const scrolled = window.pageYOffset;
                const heroImage = document.getElementById('hero-bg');
                if (heroImage) {
                    heroImage.style.transform = `scale(1.05) translateY(${scrolled * 0.2}px)`;
                }
            });
        });
    </script>
