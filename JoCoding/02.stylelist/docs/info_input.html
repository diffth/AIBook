</div>

<script>
        // Micro-interactions for form feedback
        document.querySelectorAll('.atelier-input').forEach(input => {
            input.addEventListener('focus', function() {
                this.previousElementSibling.style.color = '#000';
            });
            input.addEventListener('blur', function() {
                if(!this.value) this.previousElementSibling.style.color = '#5d5f5f';
            });
        });

        // Simple button active state visual feedback
