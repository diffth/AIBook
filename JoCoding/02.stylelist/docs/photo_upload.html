<main class="pt-24 pb-32 px-5 max-w-[1200px] mx-auto min-h-screen flex flex-col">

<!-- Headline -->
<section class="mb-10">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-3">전신 사진을 업로드해주세요</h2>
<p class="text-on-surface-variant font-body-md max-w-md">
                업로드하신 사진은 고객님의 체형을 정밀하게 분석하여 맞춤형 스타일링을 제안하는 데에만 사용됩니다. 인공지능이 실루엣을 인식할 수 있도록 가이드를 확인해 주세요.
            </p>

<!-- Upload Area -->

<p class="text-[11px] leading-relaxed text-on-surface-variant text-left">
                            밝은 곳에서 정면을 응시하고, 팔과 다리가 몸에서 살짝 떨어진 자세로 촬영된 사진이 가장 정확하게 분석됩니다.
                        </p>

<input accept="image/*" class="hidden" id="file-input" type="file"/>
</div>

                분석 시작하기
            </button>
</div>
</main>
<!-- Floating Decor (Atelier Style) -->
<div class="fixed top-1/4 -right-12 w-64 h-64 rounded-full border border-outline-variant/30 pointer-events-none -z-10 animate-pulse-slow"></div>
<div class="fixed bottom-1/4 -left-20 w-80 h-80 rounded-full border border-outline-variant/20 pointer-events-none -z-10 animate-pulse-slow" style="animation-delay: 1.5s;"></div>
<script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');

        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('bg-surface-container-highest', 'border-primary');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('bg-surface-container-highest', 'border-primary');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('bg-surface-container-highest', 'border-primary');
            const files = e.dataTransfer.files;
            if (files.length) {
                console.log('File dropped:', files[0].name);
                // Handle file upload logic here
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) {
                console.log('File selected:', e.target.files[0].name);
                // Handle file upload logic here
            }
        });
    </script>
