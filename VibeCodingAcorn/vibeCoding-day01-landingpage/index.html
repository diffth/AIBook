<!DOCTYPE html>
<html lang="ko">
<head>

  <title>도토리의 바이브 코딩 대시보드</title>
  <!-- Google Fonts: Outfit & Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">

<body>

  <!-- 1. Title Bar (Navigation) -->
  <header class="title-bar">
    <div class="container header-container">
      <div class="logo">
        <i class="fa-solid fa-seedling logo-icon"></i>

      <nav class="nav-links">
        <a href="#hero" class="nav-link active">Home</a>
        <a href="#youtube" class="nav-link">YouTube</a>
        <a href="#github" class="nav-link">GitHub</a>
        <a href="#contact" class="nav-link">Contact</a>
      </nav>
      <button class="theme-toggle" id="themeToggleBtn" aria-label="Toggle Theme">
        <i class="fa-solid fa-moon"></i>
      </button>
    </div>
  </header>

  <!-- 2. Hero Section (Top Image and Slogan) -->
  <section id="hero" class="hero-section">
    <div class="hero-overlay"></div>
    <div class="container hero-container">
      <div class="hero-content scroll-reveal">

        <div class="hero-cta">
          <a href="#youtube" class="btn btn-primary">결과물 감상하기 <i class="fa-solid fa-arrow-down"></i></a>
          <a href="#github" class="btn btn-secondary">레포지토리 방문 <i class="fa-brands fa-github"></i></a>
        </div>
      </div>
    </div>
  </section>

  <!-- Custom JavaScript -->
  <script src="script.js"></script>

</html>
