<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Firebase Auth</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Auth View -->
        <div id="auth-view" class="glass-panel">
            <div class="tabs">
                <button id="tab-login" class="tab active">로그인</button>
                <button id="tab-signup" class="tab">회원가입</button>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="auth-form active-form">
                <h2>Welcome Back</h2>
                <p class="subtitle">계속하려면 로그인해주세요.</p>
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="login-email" placeholder="이메일 주소" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="login-password" placeholder="비밀번호" required>
                </div>
                <div class="form-options">
                    <a href="#" id="forgot-password">비밀번호를 잊으셨나요?</a>
                </div>
                <button type="submit" class="btn btn-primary" id="login-btn">
                    <span>로그인</span>
                    <div class="loader"></div>
                </button>
            </form>

            <!-- Signup Form -->
            <form id="signup-form" class="auth-form">
                <h2>Create Account</h2>
                <p class="subtitle">새로운 계정을 만들어보세요.</p>
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="signup-name" placeholder="이름" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="signup-email" placeholder="이메일 주소" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="signup-password" placeholder="비밀번호 (6자 이상)" required>
                </div>
                <button type="submit" class="btn btn-primary" id="signup-btn">
                    <span>회원가입</span>
                    <div class="loader"></div>
                </button>
            </form>

            <div class="divider">
                <span>또는</span>
            </div>

            <button id="google-login-btn" class="btn btn-outline">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" width="20">
                Google로 계속하기
            </button>
            
            <div id="auth-message" class="message"></div>
        </div>

        <!-- Dashboard View (Hidden by default) -->
        <div id="dashboard-view" class="glass-panel hidden">
            <div class="dashboard-content">
                <div class="avatar-placeholder" id="user-avatar"><i class="fas fa-user"></i></div>
                <h1 id="welcome-message">환영합니다!</h1>
                <p id="user-email-display" class="subtitle"></p>
                
                <div class="dashboard-cards">
                    <div class="card">
                        <i class="fas fa-shield-alt"></i>
                        <h3>안전한 세션</h3>
                        <p>localStorage를 통해 로그인 상태가 안전하게 유지되고 있습니다.</p>
                    </div>
                </div>

                <button id="logout-btn" class="btn btn-primary">
                    <i class="fas fa-sign-out-alt"></i> 로그아웃
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase App (Module) -->
    <script type="module" src="app.js"></script>
</body>
</html>
