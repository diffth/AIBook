name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

# GitHub Pages 배포를 위한 권한 설정
permissions:
  contents: read
  pages: write
  id-token: write

# 동시성 제어 (중복 배포 방지)
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # 1. 빌드 단계 (Build Job)
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 배포할 대상 폴더 경로 설정 (day04-simple-calc)
          path: 'VibeCodingAcorn/vibeCoding-day04-simple-calc'

  # 2. 배포 단계 (Deploy Job)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
